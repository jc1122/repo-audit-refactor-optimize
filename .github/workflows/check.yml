name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install pytest==9.0.3
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Release checks
        run: python scripts/check_release.py

  install-smoke:
    # The two-host installer must plan and stage the same body for Codex and
    # Claude Code without network access (--skip-core / --dry-run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dry-run both harnesses
        run: |
          ./bootstrap/install.sh --harness codex --dry-run
          ./bootstrap/install.sh --harness claude --dry-run
      - name: Real skill-body install (no core)
        run: |
          ./bootstrap/install.sh --dest /tmp/smoke-codex --harness codex --skip-core
          ./bootstrap/install.sh --dest /tmp/smoke-claude --harness claude --skip-core
          diff -r /tmp/smoke-codex/repo-audit-refactor-optimize \
                  /tmp/smoke-claude/repo-audit-refactor-optimize
          test -f /tmp/smoke-codex/repo-audit-refactor-optimize/SKILL.md
          test -x /tmp/smoke-codex/repo-audit-refactor-optimize/scripts/repo-audit
      - name: Launcher fails closed without a runtime
        run: |
          set +e
          /tmp/smoke-codex/repo-audit-refactor-optimize/scripts/repo-audit doctor
          code=$?
          test $code -eq 2
